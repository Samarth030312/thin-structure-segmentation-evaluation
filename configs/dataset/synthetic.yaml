# Synthetic UAV road-marking dataset (generated by scripts/make_synthetic.py).
# Mirrors the folder contract and taxonomy of the real target dataset.
dataset:
  name: synthetic
  root: datasets/synthetic
  num_classes: 7
  ignore_index: null
  foreground_only: true        # report mean metrics over markings, not background
  image_size: [256, 256]
  train_split: train
  val_split: val
  test_split: test
  strict: true
  class_names:
    - background
    - solid_lane_line
    - dashed_lane_line
    - zebra_crossing
    - road_arrow
    - stop_line
    - yellow_line
