# Converged 6-loss ablation (U-Net++): loss=ce. Same config as rlmd_unetpp_core.
_base_:
  - ../dataset/rlmd.yaml
  - ../model/unetpp.yaml
  - ../loss/ce.yaml
  - ../train/gpu.yaml
run_name: rlmd_unetpp_ce
seed: 42
model: {pretrained: true}
dataset: {image_size: [384, 384], subsample: 500}
train:
  epochs: 12
  batch_size: 4
  grad_accum: 2
  amp: false
  num_workers: 6
  optimizer: {name: adamw, lr: 0.0004, weight_decay: 0.0001}
notes: "RLMD converged 6-loss ablation: unetpp+ce (seed 42)"
