# Cross-dataset: train U-Net on rlmd_bin (binary).
_base_:
  - ../dataset/rlmd_bin.yaml
  - ../model/unet.yaml
  - ../loss/ce_dice.yaml
  - ../train/gpu.yaml
run_name: xd_rlmd_bin
seed: 42
model: {pretrained: true}
train:
  epochs: 12
  batch_size: 8
  amp: false
  num_workers: 6
  optimizer: {name: adamw, lr: 0.0004, weight_decay: 0.0001}
notes: "cross-dataset binary foreground: rlmd_bin"
